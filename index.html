<!doctype html><html lang="nn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050b11"><title>Snowman Driver v13</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b11;color:#fff;font-family:Arial,sans-serif;touch-action:manipulation}#app{position:fixed;inset:0;background:#0b151e}.mapWrap{position:absolute;inset:-35%;transform-origin:50% 50%;transition:transform .18s linear}#map{position:absolute;inset:0}.leaflet-control-container{display:none}.top{position:absolute;z-index:900;left:12px;right:12px;top:max(10px,env(safe-area-inset-top));height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;pointer-events:none}.brand{justify-self:start;background:rgba(5,11,17,.88);border:1px solid #34485b;border-radius:13px;padding:8px 12px;font-weight:900;font-size:19px}.brand small{display:block;font-size:9px;color:#9fb2c4;letter-spacing:1px}.depth{justify-self:center;background:rgba(5,11,17,.92);border:2px solid #3c5267;border-radius:15px;padding:6px 22px;text-align:center;min-width:155px}.depth small{display:block;font-size:9px;color:#9fb2c4;letter-spacing:1.3px}.depth strong{font-size:34px;line-height:1}.status{justify-self:end;background:rgba(5,11,17,.88);border:1px solid #34485b;border-radius:13px;padding:8px 11px;text-align:right;font-size:12px}.green{color:#48e07b}.look{position:absolute;z-index:720;left:50%;top:13%;height:43%;width:3px;margin-left:-1px;background:linear-gradient(transparent,rgba(71,177,255,.8));pointer-events:none}.foot{position:absolute;z-index:760;left:50%;top:63%;height:112px;transform:translate(-50%,-50%);border:2px solid rgba(71,177,255,.95);background:rgba(71,177,255,.10);border-radius:9px;pointer-events:none}.groomer{position:absolute;z-index:780;left:50%;top:63%;width:80px;height:116px;transform:translate(-50%,-50%);opacity:.62;filter:drop-shadow(0 4px 4px #000);pointer-events:none}.groomer svg{width:100%;height:100%}.widthTag{position:absolute;z-index:790;left:50%;top:calc(63% + 64px);transform:translateX(-50%);background:rgba(5,11,17,.85);padding:4px 8px;border-radius:9px;font-size:11px;font-weight:900}.bottomInfo{position:absolute;z-index:900;left:12px;bottom:92px;background:rgba(5,11,17,.88);border:1px solid #34485b;border-radius:13px;padding:8px 12px;display:flex;gap:18px;font-size:12px;pointer-events:none}.bottomInfo b{font-size:18px}.toolbar{position:absolute;z-index:950;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;background:rgba(5,11,17,.92);border:1px solid #34485b;border-radius:17px;padding:7px}.tool{width:58px;height:58px;border:1px solid #40566b;border-radius:12px;background:#142331;color:white;font-weight:800;font-size:10px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.tool .ico{font-size:24px;line-height:25px}.tool.on{background:#1b638f;border-color:#58baff}.tool.warn{background:#634b19}.sheet{position:absolute;z-index:1100;right:10px;top:82px;width:min(340px,calc(100vw - 20px));max-height:calc(100vh - 105px);overflow:auto;background:rgba(8,17,25,.97);border:1px solid #455c70;border-radius:16px;padding:15px;display:none;box-shadow:0 8px 35px #000}.sheet.open{display:block}.sheet h2{font-size:17px;margin:0 0 12px}.row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #293b4c;padding:10px 0;font-size:13px}.row input{width:95px;height:40px;border-radius:8px;border:1px solid #455c70;background:#142331;color:#fff;text-align:center;font-weight:800}.btn{width:100%;height:45px;margin-top:7px;border:1px solid #455c70;border-radius:9px;background:#1b638f;color:white;font-weight:900}.close{float:right;background:#243746;color:white;border:0;border-radius:8px;width:35px;height:35px}.legend{position:absolute;z-index:900;right:12px;bottom:92px;background:rgba(5,11,17,.86);border-radius:10px;padding:7px;font-size:9px}.leg{display:flex;align-items:center;gap:5px;margin:3px}.sw{width:15px;height:8px;border-radius:3px}.toast{position:absolute;z-index:1200;left:50%;top:88px;transform:translateX(-50%);background:rgba(5,11,17,.92);border:1px solid #40566b;border-radius:10px;padding:8px 13px;font-size:11px;display:none}.north{position:absolute;z-index:900;right:16px;top:92px;width:45px;height:45px;border-radius:50%;background:rgba(5,11,17,.88);border:1px solid #40566b;display:grid;place-items:center;color:#ff6570;font-weight:900;pointer-events:none}@media(max-width:650px){.brand{font-size:15px;padding:7px 9px}.depth{min-width:125px;padding:5px 12px}.depth strong{font-size:28px}.status{font-size:10px}.toolbar{gap:4px;padding:5px}.tool{width:49px;height:53px}.tool .ico{font-size:21px}.bottomInfo{bottom:80px;gap:10px;padding:6px 9px}.bottomInfo b{font-size:15px}.legend{bottom:80px}.groomer{width:72px;height:104px}.foot{height:101px}.widthTag{top:calc(63% + 58px)}}
</style></head><body><div id="app"><div id="rotator" class="mapWrap"><div id="map"></div></div><div class="look"></div><div class="top"><div class="brand">SNOWMAN<small>by Alpindata • DRIVER v13</small></div><div id="depthBox" class="depth"><small>SNØDJUPNE</small><strong id="depth">--</strong></div><div class="status"><span id="fix" class="green">GPS KLAR</span><br><span id="acc">--</span></div></div><div id="north" class="north">N</div><div id="foot" class="foot"></div><div class="groomer"><svg viewBox="0 0 78 112"><path d="M17 13 L61 13 L67 25 L64 78 L58 91 L20 91 L14 78 L11 25 Z" fill="#eef4f8" fill-opacity=".58" stroke="#061019" stroke-width="3"/><path d="M24 21 L54 21 L58 42 L20 42 Z" fill="#20384c" fill-opacity=".72"/><rect x="17" y="46" width="44" height="34" rx="6" fill="#dce5eb" fill-opacity=".5" stroke="#061019" stroke-width="2"/><rect x="4" y="29" width="13" height="55" rx="5" fill="#182631" fill-opacity=".8" stroke="#061019" stroke-width="3"/><rect x="61" y="29" width="13" height="55" rx="5" fill="#182631" fill-opacity=".8" stroke="#061019" stroke-width="3"/><path d="M9 91 L69 91 L76 106 L2 106 Z" fill="#eef4f8" fill-opacity=".5" stroke="#061019" stroke-width="3"/><circle cx="39" cy="56" r="4" fill="#47b1ff" stroke="white" stroke-width="2"/><path d="M29 7 L39 0 L49 7" fill="none" stroke="#47b1ff" stroke-width="4"/></svg></div><div id="widthTag" class="widthTag">5,5 m</div><div class="bottomInfo"><span>FART<br><b id="speed">0.0</b> km/t</span><span>KURS<br><b id="course">0°</b></span><span>SPOR<br><b id="distance">0</b> m</span></div><div id="legend" class="legend"><div class="leg"><i class="sw" style="background:#ff5967"></i>&lt;0,40 m</div><div class="leg"><i class="sw" style="background:#ffc247"></i>0,40–0,65</div><div class="leg"><i class="sw" style="background:#39d875"></i>0,65–1,30</div><div class="leg"><i class="sw" style="background:#48aaff"></i>&gt;1,30 m</div></div><div class="toolbar"><button class="tool" onclick="zoom(-1)"><span class="ico">−</span>ZOOM</button><button id="layerBtn" class="tool on" onclick="toggleSnow()"><span class="ico">❄</span>SNØ</button><button id="trackBtn" class="tool on" onclick="toggleTrack()"><span class="ico">↝</span>SPOR</button><button class="tool" onclick="center()"><span class="ico">⌖</span>SENTRER</button><button id="demoBtn" class="tool warn" onclick="toggleDemo()"><span class="ico">▶</span>DEMO</button><button class="tool" onclick="openSettings()"><span class="ico">⚙</span>INNST.</button><button class="tool" onclick="zoom(1)"><span class="ico">＋</span>ZOOM</button></div><div id="settings" class="sheet"><button class="close" onclick="openSettings()">×</button><h2>Snowman innstillingar</h2><div class="row"><span>Maskinbreidde</span><input id="machineWidth" type="number" min="2" max="15" step="0.1" value="5.5" onchange="saveSettings()"></div><div class="row"><span>Demo snødjupne</span><input id="demoDepth" type="number" min="0" max="10" step="0.05" value="0.80" onchange="saveSettings()"></div><div class="row"><span>Kart</span><b>Retning opp</b></div><div class="row"><span>Terrengmodell</span><b id="terrain">Demo DTM</b></div><div class="row"><span>GNSS</span><b id="gnss">Mobil / simulert RTK</b></div><button class="btn" onclick="startGPS()">START MOBIL-GPS</button><button class="btn" onclick="toggleFullscreen()">FULLSKJERM</button><button class="btn" style="background:#273947" onclick="clearData()">NULLSTILL SPOR</button></div><div id="toast" class="toast"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const $=x=>document.getElementById(x);let watchId=null,last=null,heading=0,displayHeading=0,distance=0,demo=false,snowOn=true,trackOn=true,snow=[],pts=[],machineWidth=5.5,demoDepth=.8;try{machineWidth=parseFloat(localStorage.getItem('sm_width'))||5.5;demoDepth=parseFloat(localStorage.getItem('sm_depth'))||.8}catch{}$('machineWidth').value=machineWidth;$('demoDepth').value=demoDepth;const map=L.map('map',{zoomControl:false,attributionControl:false,fadeAnimation:false,zoomAnimation:false}).setView([62.39,6.58],18);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20}).addTo(map);const track=L.polyline([],{weight:4,opacity:.8,color:'#fff'}).addTo(map);function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',1800)}function startGPS(){if(!navigator.geolocation)return toast('GPS er ikkje tilgjengeleg');if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(update,e=>toast('GPS-feil: '+e.message),{enableHighAccuracy:true,timeout:20000,maximumAge:250});$('fix').textContent=demo?'RTK FIX*':'GPS SØKJER';openSettings(false)}function update(p){const c=p.coords,ll=L.latLng(c.latitude,c.longitude);let h=Number.isFinite(c.heading)?c.heading:null;if(last){let d=map.distance(last,ll);if(d>.6){distance+=d;if(h===null)h=bearing(last,ll)}}if(h!==null)heading=h;displayHeading=smooth(displayHeading,heading,.28);last=ll;const kmh=c.speed==null?0:c.speed*3.6;$('speed').textContent=kmh.toFixed(1);$('course').textContent=Math.round(displayHeading)+'°';$('distance').textContent=Math.round(distance);$('rotator').style.transform='rotate('+(-displayHeading)+'deg)';$('north').style.transform='rotate('+(-displayHeading)+'deg)';if(demo){$('fix').textContent='RTK FIX*';$('acc').textContent='± 0,02 m • SIMULERT';setDepth(demoDepth);paint(ll,demoDepth)}else{$('fix').textContent='MOBIL GPS';$('acc').textContent='± '+Math.round(c.accuracy)+' m';$('depth').textContent='--'}pts.push(ll);if(pts.length>1000)pts.shift();track.setLatLngs(pts);map.setView(offset(ll,displayHeading,25),map.getZoom(),{animate:false});updateWidth()}function setDepth(d){$('depth').textContent=d.toFixed(2).replace('.',',')+' m';let col=color(d);$('depthBox').style.borderColor=col;$('depth').style.color=col}function color(d){return d<.4?'#ff5967':d<.65?'#ffc247':d<1.3?'#39d875':'#48aaff'}function paint(ll,d){if(!snowOn)return;let val=Math.max(.05,d+Math.sin(Date.now()/1600)*.13),r=Math.max(8,m2px(machineWidth/2));let x=L.circleMarker(ll,{radius:r,stroke:false,fillOpacity:.58,fillColor:color(val)}).addTo(map);snow.push(x);if(snow.length>650)map.removeLayer(snow.shift())}function toggleDemo(){demo=!demo;$('demoBtn').classList.toggle('on',demo);$('demoBtn').classList.toggle('warn',!demo);$('terrain').textContent=demo?'DTM 1 m (simulert)':'Ikkje kopla';if(demo){setDepth(demoDepth);$('fix').textContent='RTK FIX*';$('acc').textContent='± 0,02 m • SIMULERT';toast('Investor-demo aktiv')}else{$('depth').textContent='--';$('depth').style.color='#fff';$('fix').textContent='MOBIL GPS';toast('Live-modus aktiv')}if(watchId===null)startGPS()}function toggleSnow(){snowOn=!snowOn;$('layerBtn').classList.toggle('on',snowOn);snow.forEach(x=>snowOn?x.addTo(map):map.removeLayer(x));$('legend').style.display=snowOn?'block':'none'}function toggleTrack(){trackOn=!trackOn;$('trackBtn').classList.toggle('on',trackOn);if(trackOn)track.addTo(map);else map.removeLayer(track)}function zoom(d){map.setZoom(Math.max(15,Math.min(20,map.getZoom()+d)));updateWidth()}function center(){if(last)map.setView(offset(last,displayHeading,25),map.getZoom());else toast('Start GPS først')}function openSettings(force){let s=$('settings');if(force===false)s.classList.remove('open');else s.classList.toggle('open')}function saveSettings(){machineWidth=Math.max(2,Math.min(15,parseFloat($('machineWidth').value)||5.5));demoDepth=Math.max(0,parseFloat($('demoDepth').value)||.8);$('machineWidth').value=machineWidth.toFixed(1);$('demoDepth').value=demoDepth.toFixed(2);try{localStorage.setItem('sm_width',machineWidth);localStorage.setItem('sm_depth',demoDepth)}catch{}updateWidth();if(demo)setDepth(demoDepth)}function m2px(m){if(!last)return m*12;let a=map.latLngToContainerPoint(last),b=map.latLngToContainerPoint(offset(last,90,m));return Math.abs(b.x-a.x)}function updateWidth(){let px=Math.max(48,Math.min(190,m2px(machineWidth)));$('foot').style.width=px+'px';$('widthTag').textContent=machineWidth.toFixed(1).replace('.',',')+' m'}function clearData(){pts=[];track.setLatLngs([]);snow.forEach(x=>map.removeLayer(x));snow=[];distance=0;$('distance').textContent='0';toast('Spor nullstilt')}async function toggleFullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{toast('Fullskjerm ikkje støtta her')}}function smooth(a,b,k){let d=((b-a+540)%360)-180;return(a+d*k+360)%360}function bearing(a,b){let y=Math.sin((b.lng-a.lng)*Math.PI/180)*Math.cos(b.lat*Math.PI/180),x=Math.cos(a.lat*Math.PI/180)*Math.sin(b.lat*Math.PI/180)-Math.sin(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.cos((b.lng-a.lng)*Math.PI/180);return(Math.atan2(y,x)*180/Math.PI+360)%360}function offset(ll,b,m){let R=6378137,d=m/R,br=b*Math.PI/180,lat=ll.lat*Math.PI/180,lon=ll.lng*Math.PI/180,lat2=Math.asin(Math.sin(lat)*Math.cos(d)+Math.cos(lat)*Math.sin(d)*Math.cos(br)),lon2=lon+Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(lat),Math.cos(d)-Math.sin(lat)*Math.sin(lat2));return L.latLng(lat2*180/Math.PI,lon2*180/Math.PI)}updateWidth();setTimeout(()=>startGPS(),600);
</script></body></html>
