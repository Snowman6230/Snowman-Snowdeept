<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Snowman by Alpindata v2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0b0f14;--panel:#151a22;--line:#303846;--text:#f5f7fa;--muted:#8f99a8;--ok:#2fb344;--warn:#f59f00;--bad:#fa5252;--blue:#339af0}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{height:64px;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;background:#090c10;border-bottom:1px solid var(--line)}
.logo{font-size:22px;font-weight:900;letter-spacing:.8px}.by{font-size:12px;color:#b7c0cc;font-weight:400}.status{font-size:13px;font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--warn);margin-right:6px}
main{padding:9px;display:grid;grid-template-columns:1.55fr 1fr;gap:9px;height:calc(100vh - 64px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#map{height:100%;min-height:430px;background:#101720}
.side{padding:15px;overflow:auto}.label{font-size:12px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase}
.depth{font-size:64px;font-weight:900;margin:5px 0 12px}.row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
button,input{min-height:52px;border-radius:10px;border:1px solid var(--line);background:#222833;color:white;font-size:15px;font-weight:750;padding:9px}
.primary{background:#218838}.blue{background:#1769aa}.full{grid-column:1/-1}.msg{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.4}
.gpsbox{padding:10px;margin-top:10px;border:1px solid var(--line);border-radius:10px;font-size:13px}
#perm{font-weight:800}.leaflet-control-attribution{font-size:9px}
@media(max-width:800px){main{display:block;height:auto}.card{margin-bottom:9px}#map{height:48vh;min-height:360px}.depth{font-size:54px}}
</style>
</head>
<body>
<header>
 <div><div class="logo">SNOWMAN <span class="by">by Alpindata</span></div><div class="by">Snødjupne • prototype v2</div></div>
 <div class="status"><span id="dot" class="dot"></span><span id="mode">TEST</span></div>
</header>
<main>
 <section class="card"><div id="map"></div></section>
 <section class="card side">
  <div class="label">Snødjupne</div><div id="depth" class="depth">--</div>
  <div class="row"><span>Terreng (DTM)</span><b id="terrain">--</b></div>
  <div class="row"><span>GPS-høgd</span><b id="alt">--</b></div>
  <div class="row"><span>GPS-nøyaktigheit</span><b id="accuracy">--</b></div>
  <div class="row"><span>Fart</span><b id="speed">--</b></div>
  <div class="row"><span>Kurs</span><b id="heading">--</b></div>
  <div class="gpsbox">GPS-tilgang: <span id="perm">ukjent</span><br><span id="secure"></span></div>
  <div class="grid">
   <button class="primary" onclick="startGPS()">START MOBIL-GPS</button>
   <button onclick="stopGPS()">STOPP GPS</button>
   <button class="blue full" onclick="centerMap()">SENTRER PÅ POSISJON</button>
   <input id="simDepth" type="number" step=".1" value="1.20">
   <button onclick="simulate()">SIMULER</button>
  </div>
  <div id="msg" class="msg">Trykk START MOBIL-GPS. Godkjenn posisjon når telefonen spør.</div>
 </section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let watchId=null,lastPos=null,marker=null,accuracyCircle=null,track=null,trackPts=[];
const $=x=>document.getElementById(x);
const map=L.map('map',{zoomControl:true}).setView([62.39,6.58],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
track=L.polyline([],{weight:4,opacity:.8}).addTo(map);
function msg(s){$('msg').textContent=s}
function setState(text,color){$('mode').textContent=text;$('dot').style.background=color}
async function permissionState(){
 $('secure').textContent='Trygg kontekst: '+(window.isSecureContext?'JA':'NEI');
 if(navigator.permissions){
  try{let p=await navigator.permissions.query({name:'geolocation'});$('perm').textContent=p.state.toUpperCase();p.onchange=()=>{$('perm').textContent=p.state.toUpperCase()}}catch(e){}
 }
}
permissionState();
function startGPS(){
 if(!navigator.geolocation){msg('Denne nettlesaren tilbyr ikkje geolocation.');return}
 if(!window.isSecureContext){msg('GPS krev trygg nettlesarkontekst. Opne Snowman via HTTPS eller localhost på Raspberry Pi.');setState('GPS BLOKKERT','#fa5252');return}
 setState('VENTAR PÅ GPS','#f59f00'); msg('Vent på GPS-posisjon …');
 navigator.geolocation.getCurrentPosition(updatePos,gpsError,{enableHighAccuracy:true,timeout:20000,maximumAge:0});
 if(watchId!==null)navigator.geolocation.clearWatch(watchId);
 watchId=navigator.geolocation.watchPosition(updatePos,gpsError,{enableHighAccuracy:true,timeout:20000,maximumAge:500});
}
function updatePos(p){
 lastPos=p;let c=p.coords;
 $('alt').textContent=c.altitude==null?'--':c.altitude.toFixed(1)+' m';
 $('accuracy').textContent='± '+Math.round(c.accuracy)+' m';
 $('speed').textContent=c.speed==null?'--':(c.speed*3.6).toFixed(1)+' km/t';
 $('heading').textContent=c.heading==null?'--':Math.round(c.heading)+'°';
 $('perm').textContent='TILLATEN'; setState('MOBIL GPS','#2fb344');
 let ll=[c.latitude,c.longitude];
 if(!marker){marker=L.marker(ll).addTo(map).bindTooltip('Snowman',{permanent:false});accuracyCircle=L.circle(ll,{radius:c.accuracy}).addTo(map);map.setView(ll,17)}
 else{marker.setLatLng(ll);accuracyCircle.setLatLng(ll).setRadius(c.accuracy)}
 trackPts.push(ll);if(trackPts.length>3000)trackPts.shift();track.setLatLngs(trackPts);
 msg(c.latitude.toFixed(6)+', '+c.longitude.toFixed(6)+' • GPS aktiv');
}
function gpsError(e){
 let s=e.message;
 if(e.code===1)s='Posisjonstilgang er avslått. Tillat posisjon for nettlesaren/nettstaden i Android-innstillingane og prøv igjen.';
 if(e.code===2)s='Telefonen klarte ikkje å finne posisjon. Kontroller at posisjon/GPS er slått på.';
 if(e.code===3)s='GPS brukte for lang tid. Prøv ute med fri sikt mot himmelen.';
 msg(s);setState('GPS FEIL','#fa5252');permissionState();
}
function stopGPS(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;setState('GPS STOPPA','#f59f00');msg('GPS-sporing stoppa.')}
function centerMap(){if(lastPos)map.setView([lastPos.coords.latitude,lastPos.coords.longitude],17);else msg('Ingen GPS-posisjon enno.')}
function simulate(){$('depth').textContent=(parseFloat($('simDepth').value)||0).toFixed(2)+' m';setState('SIMULATOR','#339af0');msg('Simulert snødjupne. Terrengmodell blir kopla inn seinare.')}
</script>
</body></html>
