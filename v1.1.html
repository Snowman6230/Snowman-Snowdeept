<!doctype html><!-- SNOWMAN by Alpindata – Copyright © 2026 Hans Petter Brunstad Sørensen (Alpindata). Alle rettar reserverte. Sjå LICENSE. --><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNOWMAN by Alpindata v1.1 PC</title></head><body style="margin:0;background:#06121a;color:white;font-family:Arial"><div id="boot" style="padding:24px">Lastar SNOWMAN by Alpindata v1.1 PC…</div><script>
(async()=>{let h=await (await fetch('v24.html',{cache:'no-store'})).text();
/* v24 is itself a loader. We keep the proven driver UI and add a PC/GNSS control console after it has rendered. */
document.open();document.write(h);document.close();
setTimeout(()=>installPC(),1800);
function installPC(){
 const s=document.createElement('style');s.textContent=`#pc11{position:fixed;z-index:5000;left:12px;bottom:12px;width:min(390px,calc(100vw - 24px));background:#041923f2;border:1px solid #527080;border-radius:14px;box-shadow:0 10px 35px #0009;color:#eaf8ff;font:14px Arial;max-height:78vh;overflow:auto}#pc11 .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#092b39;border-radius:14px 14px 0 0;position:sticky;top:0}#pc11 .hd b{font-size:15px}#pc11 .tag{margin-left:auto;font-size:11px;color:#7ee5ff}#pc11 .body{padding:10px 12px}#pc11 button{background:#12394a;color:white;border:1px solid #557383;border-radius:9px;padding:9px 10px;margin:3px;cursor:pointer}#pc11 button.on{background:#14763a;border-color:#3cff78}#pc11 input,#pc11 select{box-sizing:border-box;width:100%;background:#06141b;color:white;border:1px solid #486371;border-radius:7px;padding:7px;margin:3px 0 7px}#pc11 .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}#pc11 .cell{background:#082531;border-radius:8px;padding:7px}#pc11 .cell span{display:block;color:#91adba;font-size:10px}#pc11 .cell b{font-size:16px}#pc11 .log{height:92px;overflow:auto;background:#020b0f;border-radius:7px;padding:7px;font:10px monospace;white-space:pre-wrap}#pc11 details{border-top:1px solid #294653;padding-top:7px;margin-top:8px}#pc11 summary{cursor:pointer;font-weight:bold}.pcwarn{color:#ffcf5b;font-size:11px;line-height:1.35}`;document.head.appendChild(s);
 const p=document.createElement('div');p.id='pc11';p.innerHTML=`<div class="hd"><b>SNOWMAN PC</b><span>by Alpindata</span><span class="tag">VERSION 1.1</span><button onclick="pcToggle()">−</button></div><div class="body" id="pcBody"><div class="grid"><div class="cell"><span>GNSS</span><b id="pcFix">IKKJE TILKOPLA</b></div><div class="cell"><span>SAT</span><b id="pcSat">--</b></div><div class="cell"><span>HØGD</span><b id="pcAlt">--</b></div><div class="cell"><span>HDOP</span><b id="pcHdop">--</b></div><div class="cell"><span>LAT</span><b id="pcLat">--</b></div><div class="cell"><span>LON</span><b id="pcLon">--</b></div></div><div style="margin-top:8px"><button id="serialBtn" onclick="pcSerial()">KOPLE LEICA / NMEA</button><button onclick="pcDemoNmea()">TEST NMEA</button></div><div class="pcwarn">Leica GS07 eller annan GNSS: bruk RS232→USB dersom PC-en ikkje har Web Serial-kompatibel seriellport. Chrome/Edge på PC over HTTPS.</div><details open><summary>GNSS / seriell</summary><label>Baudrate</label><select id="pcBaud"><option>9600</option><option>19200</option><option>38400</option><option selected>115200</option><option>230400</option></select><div class="log" id="pcLog">Klar. Trykk KOPLE LEICA / NMEA.</div></details><details><summary>NTRIP / CPOS</summary><label>Caster URL</label><input id="nUrl" placeholder="https://caster:port/mountpoint"><label>Brukarnamn</label><input id="nUser" autocomplete="username"><label>Passord</label><input id="nPass" type="password" autocomplete="current-password"><button onclick="ntripTest()">TEST NTRIP</button><button onclick="ntripStop()">STOPP</button><div class="cell"><span>NTRIP</span><b id="nStat">AV</b></div><div class="pcwarn">NTRIP direkte frå ei GitHub-side fungerer berre dersom caster tillèt nettlesartilkopling (HTTPS/CORS). For ordinær CPOS på ein produksjons-PC bør SNOWMAN ha ei lokal NTRIP-teneste som opnar TCP og sender RTCM til same GNSS-port. v1.1 testar datastraumen der nettlesaren får tilgang.</div></details><details><summary>LiDAR / terrengmodell</summary><input id="terrainFile" type="file" accept=".json,.geojson,.csv,.xyz,.txt"><button onclick="terrainLoad()">LAST MODELL</button><div class="cell"><span>LOKAL MODELL</span><b id="terrainStat">Ingen</b></div><div class="pcwarn">v1.1 kan laste og halde ei lokal fil i minnet for prototype. Snødjupne frå full LiDAR/TIN/DEM krev neste terrengmotor; demoen brukar framleis simulert djupne.</div></details></div>`;document.body.appendChild(p);
 window.pcToggle=()=>document.getElementById('pcBody').style.display=document.getElementById('pcBody').style.display==='none'?'block':'none';
 window._snowSerial={port:null,reader:null,writer:null};window._lastGGA='';
 window.pcSerial=async()=>{try{if(!('serial'in navigator))throw Error('Web Serial er ikkje støtta. Bruk Chrome/Edge på PC.');let port=await navigator.serial.requestPort();await port.open({baudRate:+document.getElementById('pcBaud').value});_snowSerial.port=port;document.getElementById('serialBtn').classList.add('on');log('Seriellport opna');readSerial(port)}catch(e){log('FEIL: '+e.message)}};
 async function readSerial(port){const dec=new TextDecoderStream();port.readable.pipeTo(dec.writable).catch(()=>{});const reader=dec.readable.getReader();_snowSerial.reader=reader;let buf='';try{while(true){let {value,done}=await reader.read();if(done)break;buf+=value;let a=buf.split(/\r?\n/);buf=a.pop();for(const line of a)parseNMEA(line.trim())}}catch(e){log('Lesefeil: '+e.message)}}
 function parseNMEA(x){if(!x||x[0]!='$')return;if(/\$(GP|GN)GGA/.test(x)){_lastGGA=x;let f=x.split(',');let q=+f[6]||0,s=+f[7]||0,hd=f[8]||'--',alt=f[9]||'--';let lat=coord(f[2],f[3]),lon=coord(f[4],f[5]);set('pcFix',q===4?'RTK FIX':q===5?'RTK FLOAT':q?'GNSS':'NO FIX');set('pcSat',s);set('pcHdop',hd);set('pcAlt',alt+' m');set('pcLat',lat==null?'--':lat.toFixed(7));set('pcLon',lon==null?'--':lon.toFixed(7));if(lat!=null&&lon!=null&&window.map){try{window.map.panTo([lat,lon])}catch(_){}}log(x.slice(0,100))}}
 function coord(v,h){if(!v)return null;let z=parseFloat(v),deg=Math.floor(z/100),min=z-deg*100,r=deg+min/60;return(h==='S'||h==='W')?-r:r}
 function set(id,v){let e=document.getElementById(id);if(e)e.textContent=v}function log(t){let e=document.getElementById('pcLog');if(!e)return;e.textContent=(new Date().toLocaleTimeString()+' '+t+'\n'+e.textContent).slice(0,5000)}
 window.pcDemoNmea=()=>parseNMEA('$GNGGA,123519,6223.0000,N,00635.0000,E,4,18,0.7,612.84,M,40.0,M,0.8,0001*00');
 window.ntripStop=()=>{if(window._nAbort)window._nAbort.abort();set('nStat','AV')};
 window.ntripTest=async()=>{let u=document.getElementById('nUrl').value.trim();if(!u){set('nStat','MANGLAR URL');return}try{window._nAbort=new AbortController();set('nStat','KOPLAR…');let headers={};let us=document.getElementById('nUser').value,pa=document.getElementById('nPass').value;if(us)headers.Authorization='Basic '+btoa(us+':'+pa);if(_lastGGA)headers['Ntrip-GGA']=_lastGGA;let r=await fetch(u,{headers,signal:_nAbort.signal,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);set('nStat','DATA INN');let reader=r.body.getReader(),bytes=0;while(true){let {value,done}=await reader.read();if(done)break;bytes+=value.length;set('nStat','RTCM '+bytes+' B');if(_snowSerial.port&&_snowSerial.port.writable){let w=_snowSerial.port.writable.getWriter();await w.write(value);w.releaseLock()}}}catch(e){set('nStat','FEIL');log('NTRIP: '+e.message)}};
 window.terrainLoad=async()=>{let f=document.getElementById('terrainFile').files[0];if(!f)return;window._terrainFile={name:f.name,size:f.size,text:await f.text()};set('terrainStat',f.name+' · '+Math.round(f.size/1024)+' kB');log('Terrengmodell lasta lokalt: '+f.name)};
 }
})().catch(e=>{document.body.innerHTML='<pre style="padding:20px">SNOWMAN v1.1 kunne ikkje starte: '+e+'</pre>'});
</script></body></html>
