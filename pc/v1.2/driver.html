<!doctype html><html lang="nn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNOWMAN PC Prototype v1.2</title>
<style>*{box-sizing:border-box}body{margin:0;background:#06131b;color:#eef;font:15px Arial;height:100vh}header{height:64px;background:#092431;display:flex;align-items:center;padding:0 18px;gap:18px}.logo{font-size:24px;font-weight:800}.status{margin-left:auto;display:flex;gap:8px}.badge,.card{background:#102d39;padding:10px;border-radius:9px}.ok{color:#4df36b}.bad{color:#ff8b6e}main{display:grid;grid-template-columns:1fr 330px;height:calc(100vh - 64px)}.map{position:relative;background:linear-gradient(145deg,#dbe5e9,#91aab5);overflow:hidden}.trail{position:absolute;left:15%;top:48%;width:70%;height:55px;background:#51a9df77;border:2px solid #267caf;border-radius:30px;transform:rotate(-8deg)}.machine{position:absolute;left:50%;top:46%;font-size:58px}.depth{position:absolute;left:18px;top:18px;background:#06202be8;padding:15px;border-radius:12px}.depth b{font-size:35px}.controls{position:absolute;left:18px;bottom:18px}.btn{background:#123848;color:#fff;border:1px solid #607b86;padding:11px;border-radius:8px;margin:3px}.green{background:#187c36}aside{background:#081b24;padding:14px;overflow:auto}.card{margin-bottom:10px}.kv{display:grid;grid-template-columns:1fr auto;gap:7px}input{width:100%;background:#0a202a;color:white;border:1px solid #526b75;padding:7px;margin:3px 0 7px}</style></head>
<body><header><div class=logo>SNOWMAN <small>by Alpindata</small><div style="font-size:11px;color:#9bb">PC PROTOTYPE v1.2 · TEST</div></div><div class=status><div class=badge>GNSS <span id=gnss class=bad>AV</span></div><div class=badge>NTRIP <span id=ntrip class=bad>AV</span></div><div class=badge>RTK <span id=rtk class=bad>NO DATA</span></div></div></header>
<main><section class=map><div class=trail></div><div class=machine>🚜</div><div class=depth>SNØDJUPNE<br><b>-- cm</b><div style="font-size:11px">LiDAR-kopling: neste teststeg</div></div><div class=controls><button id=prep class="btn green" onclick="togglePrep()">▶ START PREPARERING</button><button class=btn>VIS MASKIN</button><button class=btn>HISTORIKK</button></div></section>
<aside><div class=card><b>LIVE GNSS</b><div class=kv><span>Fix</span><b id=fix>--</b><span>Satellittar</span><b id=sat>--</b><span>HDOP</span><b id=hdop>--</b><span>Høgd</span><b id=alt>--</b><span>RTCM</span><b id=rtcm>0 B</b></div></div>
<div class=card><b>LEICA / SERIELL</b><div>COM-port</div><input id=serial_port value="COM3"><div>Baud</div><input id=baud value="115200"></div>
<div class=card><b>CPOS / NTRIP</b><div>Caster</div><input id=caster><div>Port</div><input id=caster_port value="2101"><div>Mountpoint</div><input id=mountpoint><div>Brukarnamn</div><input id=username><div>Passord</div><input id=password type=password><button class=btn onclick=save()>LAGRE / KOPLE TIL</button></div><div class=card id=err>Vent på tenesta…</div></aside></main>
<script>let preparing=false;function togglePrep(){preparing=!preparing;prep.textContent=preparing?'■ STOPP PREPARERING':'▶ START PREPARERING'}async function save(){let x={};['serial_port','baud','caster','caster_port','mountpoint','username','password'].forEach(i=>x[i]=document.getElementById(i).value);x.baud=+x.baud;x.caster_port=+x.caster_port;await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)})}async function poll(){try{let x=await(await fetch('/api/status',{cache:'no-store'})).json();gnss.textContent=x.serial_connected?'TILKOPLA':'AV';gnss.className=x.serial_connected?'ok':'bad';ntrip.textContent=x.ntrip_connected?'TILKOPLA':'AV';ntrip.className=x.ntrip_connected?'ok':'bad';rtk.textContent=x.fix;rtk.className=x.fix==='RTK FIX'?'ok':'bad';fix.textContent=x.fix;sat.textContent=x.satellites||'--';hdop.textContent=x.hdop??'--';alt.textContent=x.altitude==null?'--':x.altitude+' m';rtcm.textContent=x.bytes_rtcm+' B';err.textContent=x.last_error||'SNOWMAN-tenesta køyrer normalt'}catch(e){err.textContent='Lokal teneste svarar ikkje: '+e}setTimeout(poll,1000)}poll()</script></body></html>
